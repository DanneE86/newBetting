name: Stryktipset – sen körning (startelvor)

# Kör strax före Stryktipsets spelstopp (oftast lördag 15:59, ibland söndag):
# färska skarpa odds (The Odds API: PL, Championship, League One/Two m.fl.) + ESPN-startelvor + FotMob-kontext
# -> Stryktipset/Europatipset med odds, streck och elvor så nära spelstopp som möjligt -> webben.
# Schemat startar var 30:e minut lördag/söndag 11:00-15:30 UTC; vakten (scripts/stryk-close-guard.mjs) kör bara
# när kupongen stänger om 15-75 minuter, så det fungerar både sommar- och vintertid. Manuell start kör alltid.
on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 11-15 * * 6,0"

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  late:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Stockholm
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: 157ee3f6fab55443acdd807e5899c5f2
      # Nara spelstopp: hamta skarpa odds aven for klubbligorna och anvand dem fore aldre odds (max 20 min gamla)
      STRYK_FRESH_ODDS: "1"
      STRYK_ODDS_MAX_AGE_MIN: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Nära spelstopp?
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manuell start – kör"; else node scripts/stryk-close-guard.mjs; fi

      - name: powershell -> pwsh
        if: steps.guard.outputs.run == 'true'
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      - name: Installera beroenden
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Startelvor (ESPN)
        if: steps.guard.outputs.run == 'true'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Fetch-Lineups.ps1

      - name: Domare (tillsatta domare, domarsviter)
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/fetch-referees.mjs --upcoming

      - name: Oddset-tips med elvor/frånvaro
        if: steps.guard.outputs.run == 'true'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Update-BettingStore.ps1 -SkipDownload

      # Streck + utfall per omgång (inkrementellt): streckfavoriter utan seger i kupongen
      - name: Stryktipsstatistik (Svenska Spel)
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/fetch-stryktips-statistik.mjs

      # Tranare per match (FotMob, aktuell sasong): ny tranare de 5 forsta matcherna flyttar Stryktipsprocenten
      - name: Tränare (FotMob)
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/fetch-coaches-fotmob.mjs --current

      - name: Stryktipset/Europatipset (färska odds, streck, elvor)
        if: steps.guard.outputs.run == 'true'
        run: node scripts/fetch-stryktipset.mjs

      # Startelvor (FotMob) för Oddset-matcher och kupongerna: spelare mot spelare i GUI:t, data/startelvor.json
      - name: Startelvor
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/fetch-startelvor.mjs

      - name: Bygg webbversion
        if: steps.guard.outputs.run == 'true'
        run: node scripts/build-static-site.mjs

      - name: Committa ny data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Ingen ny data"
          else
            git commit -m "Data: Stryktipset sen körning $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - name: Publicera webbversion
        if: steps.guard.outputs.run == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy site --project-name newbetting --branch main --commit-dirty=true
