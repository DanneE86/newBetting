name: Hämtning (manuell)

# Samma kedja som GUI:ts "Hämta data (full)":
# öppna källor -> OddsPortal -> store/tips -> ledger -> Daily Scanner, sedan commit av data/.
# Körs bara manuellt (Actions -> "Kör workflow"): ingen data hämtas automatiskt.
# Spelarstatistik (Understat-historik m.m., ~16 min) hämtas på måndagar eller med "spelare" ikryssat.
on:
  workflow_dispatch:
    inputs:
      spelare:
        description: "Hämta även spelarstatistik (~16 min extra)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    # Linux: minuterna räknas 1x (Windows 2x). pwsh 7 kör skripten; "powershell" länkas till pwsh.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Stockholm
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 157ee3f6fab55443acdd807e5899c5f2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: powershell -> pwsh
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      - name: Installera beroenden
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Hämta öppna källor
        shell: pwsh
        env:
          SPELARE: ${{ inputs.spelare }}
        run: |
          $players = ((Get-Date).DayOfWeek -eq "Monday") -or ($env:SPELARE -eq "true")
          Write-Host "Spelarstatistik: $players"
          if ($players) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Fetch-OpenSources.ps1
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Fetch-OpenSources.ps1 -SkipPlayers
          }

      - name: OddsPortal (reservodds)
        continue-on-error: true
        run: node scripts/fetch-oddsportal.mjs

      - name: Bygg store + tips
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Update-BettingStore.ps1 -SkipDownload

      - name: Ledger
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Update-TipsLedger.ps1

      - name: Daily Scanner
        run: |
          set -o pipefail
          node scripts/daily-scanner.mjs | { grep -v '^@@progress' || true; }

      - name: Datagranskning per liga
        continue-on-error: true
        run: node scripts/audit-leagues.mjs --quiet

      # Streck + utfall per omgång (inkrementellt): streckfavoriter utan seger i kupongen
      - name: Stryktipsstatistik (Svenska Spel)
        continue-on-error: true
        run: node scripts/fetch-stryktips-statistik.mjs

      - name: Stryktipset (Svenska Spel)
        continue-on-error: true
        run: node scripts/fetch-stryktipset.mjs

      # En CSV per liga (spelade + kommande, odds fore matchen sparas) for traning, se data/matcher/README.md
      - name: Matcher per liga
        continue-on-error: true
        run: node scripts/export-league-matches.mjs

      # En lardomsfil per liga: tipsens traff, vad som blev fel och testade situationer (docs/lardomar/anteckningar/)
      - name: Felanalys per liga
        continue-on-error: true
        run: node scripts/tips-felanalys.mjs

      # Trupper (skador, betyg, marknadsvarde) och tabeller for alla ligor fran FotMob, med historik
      - name: Trupper och tabeller
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/fetch-squads.mjs

      # Startelvor (FotMob) för Oddset-matcher och kupongerna: spelare mot spelare i GUI:t, data/startelvor.json
      - name: Startelvor
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/fetch-startelvor.mjs

      - name: Bygg webbversion
        run: node scripts/build-static-site.mjs

      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/analys docs/lardomar
          if git diff --cached --quiet; then
            echo "Ingen ny data"
          else
            git commit -m "Data: daglig hämtning $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      # https://newbetting.pages.dev (lösenordsskydd: functions/_middleware.js + secret SITE_PASSWORD).
      # Hoppas över tills secret CLOUDFLARE_API_TOKEN finns (Cloudflare-token med "Cloudflare Pages: Edit").
      - name: Publicera webbversion
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy site --project-name newbetting --branch main --commit-dirty=true
