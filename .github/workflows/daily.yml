name: Daglig hämtning

# Samma kedja som GUI:ts "Hämta data (full)":
# öppna källor -> OddsPortal -> store/tips -> ledger -> Daily Scanner, sedan commit av data/.
# Spelarstatistik (Understat-historik m.m., ~16 min) hämtas bara på måndagar eller vid manuell körning
# med "spelare" ikryssat; övriga dagar används senast committade data/open/player_stats.json.
on:
  schedule:
    - cron: "0 4 * * *" # 06:00 svensk sommartid (05:00 vintertid)
  workflow_dispatch:
    inputs:
      spelare:
        description: "Hämta även spelarstatistik (~16 min extra)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    # Linux: minuterna räknas 1x (Windows 2x). pwsh 7 kör skripten; "powershell" länkas till pwsh.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Stockholm
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 157ee3f6fab55443acdd807e5899c5f2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: powershell -> pwsh
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      - name: Installera beroenden
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Hämta öppna källor
        shell: pwsh
        env:
          SPELARE: ${{ inputs.spelare }}
        run: |
          $players = ((Get-Date).DayOfWeek -eq "Monday") -or ($env:SPELARE -eq "true")
          Write-Host "Spelarstatistik: $players"
          if ($players) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Fetch-OpenSources.ps1
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Fetch-OpenSources.ps1 -SkipPlayers
          }

      - name: OddsPortal (reservodds)
        continue-on-error: true
        run: node scripts/fetch-oddsportal.mjs

      - name: Bygg store + tips
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Update-BettingStore.ps1 -SkipDownload

      - name: Ledger
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Update-TipsLedger.ps1

      - name: Daily Scanner
        run: |
          set -o pipefail
          node scripts/daily-scanner.mjs | { grep -v '^@@progress' || true; }

      - name: Datagranskning per liga
        continue-on-error: true
        run: node scripts/audit-leagues.mjs --quiet

      - name: Stryktipset (Svenska Spel)
        continue-on-error: true
        run: node scripts/fetch-stryktipset.mjs

      - name: Bygg webbversion
        run: node scripts/build-static-site.mjs

      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/analys
          if git diff --cached --quiet; then
            echo "Ingen ny data"
          else
            git commit -m "Data: daglig hämtning $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      # https://newbetting.pages.dev (lösenordsskydd: functions/_middleware.js + secret SITE_PASSWORD).
      # Hoppas över tills secret CLOUDFLARE_API_TOKEN finns (Cloudflare-token med "Cloudflare Pages: Edit").
      - name: Publicera webbversion
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy site --project-name newbetting --branch main --commit-dirty=true
